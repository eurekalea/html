<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料去識別化互動教學</title>
  
  <!-- 引入 Tailwind CSS (自動處理所有 RWD 自適應與排版) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 引入 Babel 讓瀏覽器可以直接編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    /* 隱藏未編譯前的原始碼閃爍 */
    #root:empty { display: none; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <!-- React 應用程式代碼 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 圖示元件 (替換原先的 lucide-react，以純 SVG 確保單一檔案運行無礙) ---
    const Shield = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>;
    const ShieldAlert = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>;
    const CheckCircle2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>;
    const AlertCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>;
    const Info = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>;
    const Trash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>;
    const Lock = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const ArrowRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>;
    const UserCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>;
    // -------------------------------------------------------------------------

    // 定義欄位與正確的處理規則
    const COLUMNS = [
      { id: 'class', label: '班級', targetAction: 'generalize', hint: '我們只需要知道是九年級，不需要知道具體是哪一班。使用什麼技術可以降低精確度？' },
      { id: 'seat', label: '座號', targetAction: 'delete', hint: '分析「居住里別」和「社團」的關聯，需要用到座號嗎？記得資料最小化原則。' },
      { id: 'name', label: '姓名', targetAction: 'suppress', hint: '不能出現完整的名字，但可以保留姓氏，避免直接識別出特定學生。' },
      { id: 'neighborhood', label: '居住里別', targetAction: 'keep', hint: '這是我們分析的重點項目之一，如果移除了就無法分析囉！' },
      { id: 'club', label: '社團', targetAction: 'keep', hint: '這是我們分析的重點項目之一，如果移除了就無法分析囉！' },
      { id: 'subject', label: '擅長科目', targetAction: 'delete', hint: '分析「居住里別」和「社團」的關聯，需要用到擅長科目嗎？' },
      { id: 'birthday', label: '生日', targetAction: 'delete', hint: '生日是高度敏感的個資，且與本次分析無關。' },
    ];

    // 從您提供的 CSV 擴充了模擬資料，包含更多筆
    const RAW_DATA = [
      { id: 1, class: '903', seat: '9', name: '張承翰', neighborhood: '頂店里', club: '飛盤社', subject: '英文', birthday: '7月1日' },
      { id: 2, class: '910', seat: '7', name: '陳俊宏', neighborhood: '岷山里', club: '口琴社', subject: '數學', birthday: '6月23日' },
      { id: 3, class: '908', seat: '25', name: '陳志豪', neighborhood: '大甲里', club: '匹克球社', subject: '資訊', birthday: '10月26日' },
      { id: 4, class: '903', seat: '12', name: '楊柏翰', neighborhood: '頂店里', club: '排球社', subject: '英文', birthday: '8月21日' },
      { id: 5, class: '910', seat: '20', name: '黃志豪', neighborhood: '平安里', club: '排球社', subject: '國文', birthday: '3月13日' },
      { id: 6, class: '904', seat: '19', name: '林冠廷', neighborhood: '岷山里', club: '排球社', subject: '藝術', birthday: '2月3日' },
      { id: 7, class: '902', seat: '11', name: '王子晴', neighborhood: '朝陽里', club: '閱讀社', subject: '英文', birthday: '11月15日' },
      { id: 8, class: '907', seat: '5', name: '劉冠廷', neighborhood: '平安里', club: '樂高機器人社', subject: '藝術', birthday: '2月9日' },
      { id: 9, class: '908', seat: '32', name: '李佳穎', neighborhood: '平安里', club: '匹克球社', subject: '資訊', birthday: '7月19日' },
    ];

    // 定義可選的處理動作
    const ACTIONS = [
      { value: '', label: '選擇處理方式...' },
      { value: 'keep', label: '保留 (Keep)' },
      { value: 'delete', label: '刪除 (Delete)' },
      { value: 'generalize', label: '泛化 (Generalize)' },
      { value: 'suppress', label: '抑制 (Suppress)' },
    ];

    function App() {
      // 記錄每個欄位目前的狀態 (null 代表尚未處理正確)
      const [columnStates, setColumnStates] = useState({});
      const [feedback, setFeedback] = useState(null); // { type: 'success' | 'error', message: '...' }
      const [isComplete, setIsComplete] = useState(false);

      // 檢查是否所有欄位都處理完畢
      useEffect(() => {
        const completedCount = Object.keys(columnStates).length;
        if (completedCount === COLUMNS.length) {
          setIsComplete(true);
          setFeedback({
            type: 'success',
            message: '🎉 太棒了！您已成功完成所有資料的去識別化處理。這份資料現在可以安全地交給社團活動組進行分析了！'
          });
        }
      }, [columnStates]);

      // 處理使用者選擇動作
      const handleActionSelect = (columnId, actionValue) => {
        if (!actionValue) return;

        const columnConfig = COLUMNS.find(c => c.id === columnId);
        
        if (actionValue === columnConfig.targetAction) {
          // 答對了
          setColumnStates(prev => ({ ...prev, [columnId]: actionValue }));
          setFeedback({
            type: 'success',
            message: `✅ 正確！【${columnConfig.label}】欄位已成功應用處理。`
          });
        } else {
          // 答錯了
          setFeedback({
            type: 'error',
            message: `❌ 處理錯誤：【${columnConfig.label}】欄位不適合這個操作。${columnConfig.hint}`
          });
        }
      };

      // 根據動作轉換顯示的資料
      const transformData = (value, action, colId) => {
        if (!action) return value; // 尚未處理
        
        switch (action) {
          case 'delete':
            return <span className="text-gray-300 line-through">已移除</span>;
          case 'generalize':
            if (colId === 'class') return <span className="text-blue-600 font-bold">9年級</span>;
            return value;
          case 'suppress':
            if (colId === 'name') return <span className="text-purple-600 font-bold">{value.charAt(0)}**</span>;
            return value;
          case 'keep':
            return <span className="text-emerald-700 font-medium">{value}</span>;
          default:
            return value;
        }
      };

      return (
        <div className="min-h-screen p-3 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-4 md:space-y-6">
            
            {/* Header Title */}
            <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 sm:gap-0">
              <div className="flex items-center gap-3 md:gap-4">
                <div className="bg-blue-100 p-2 md:p-3 rounded-full text-blue-600 flex-shrink-0">
                  <Shield className="w-6 h-6 md:w-8 md:h-8" />
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-900">資料去識別化互動教學</h1>
                  <p className="text-xs md:text-sm text-slate-500">學習如何保護隱私，同時保有資料分析的價值。</p>
                </div>
              </div>
              <div className="flex items-center gap-2 sm:block w-full sm:w-auto justify-between bg-slate-50 sm:bg-transparent p-3 sm:p-0 rounded-lg sm:text-right border sm:border-0 border-slate-200">
                <div className="text-xs md:text-sm font-semibold text-slate-500 sm:text-slate-400">目前進度</div>
                <div className="text-lg md:text-2xl font-bold text-blue-600">
                  {Object.keys(columnStates).length} / {COLUMNS.length}
                </div>
              </div>
            </header>

            {/* 情境說明卡片 */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col lg:flex-row">
              <div className="bg-blue-50 p-4 md:p-6 lg:w-1/3 border-b lg:border-b-0 lg:border-r border-slate-200">
                <h2 className="text-base md:text-lg font-bold flex items-center gap-2 mb-3 text-blue-800">
                  <Info className="w-5 h-5" /> 情境任務設定
                </h2>
                <p className="text-sm leading-relaxed text-slate-700 mb-4">
                  學校的「社團活動組」委託你擔任 <b>資料隱私顧問</b>。他們想要分析一份九年級學生的資料，找出：<br/><br/>
                  <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded font-medium">學生的「居住區域」與「社團選擇」是否有關聯？</span>
                </p>
                <div className="bg-red-50 p-3 rounded-lg border border-red-100 flex gap-2">
                  <ShieldAlert className="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" />
                  <p className="text-xs text-red-700">
                    警告：原始資料包含太多個人隱私！若直接傳送分析，不小心外流會導致嚴重個資外洩。請先進行<b>去識別化處理</b>。
                  </p>
                </div>
              </div>
              
              <div className="p-4 md:p-6 lg:w-2/3">
                <h3 className="font-bold text-slate-800 mb-3 md:mb-4">去識別化核心技術小百科</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4">
                  <div className="border border-slate-200 rounded-lg p-3 hover:shadow-md transition bg-white">
                    <div className="flex items-center gap-2 text-purple-600 font-bold mb-1 md:mb-2 text-sm md:text-base">
                      <Lock className="w-4 h-4 md:w-5 md:h-5" /> 抑制 (Suppression)
                    </div>
                    <p className="text-xs md:text-sm text-slate-600">將資料的部分或全部用符號（如 *）遮蔽。例如將「王大明」變成「王**」。</p>
                  </div>
                  <div className="border border-slate-200 rounded-lg p-3 hover:shadow-md transition bg-white">
                    <div className="flex items-center gap-2 text-blue-600 font-bold mb-1 md:mb-2 text-sm md:text-base">
                      <ArrowRight className="w-4 h-4 md:w-5 md:h-5" /> 泛化 (Generalization)
                    </div>
                    <p className="text-xs md:text-sm text-slate-600">降低資料的精確度，轉換為一個較大的區間或類別。例如將「23歲」變成「20-30歲」。</p>
                  </div>
                  <div className="border border-slate-200 rounded-lg p-3 hover:shadow-md transition bg-white">
                    <div className="flex items-center gap-2 text-red-500 font-bold mb-1 md:mb-2 text-sm md:text-base">
                      <Trash2 className="w-4 h-4 md:w-5 md:h-5" /> 刪除 (Minimization)
                    </div>
                    <p className="text-xs md:text-sm text-slate-600">基於「資料最小化原則」，直接移除與本次分析目的毫無關聯的敏感欄位。</p>
                  </div>
                </div>
              </div>
            </section>

            {/* 系統提示訊息區塊 */}
            {feedback && (
              <div className={`p-4 rounded-lg flex items-start gap-3 transition-all duration-300 ${
                feedback.type === 'success' ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 
                'bg-red-50 border border-red-200 text-red-800'
              }`}>
                {feedback.type === 'success' ? <CheckCircle2 className="w-5 h-5 flex-shrink-0 mt-0.5" /> : <AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />}
                <div className="font-medium text-sm">{feedback.message}</div>
              </div>
            )}

            {/* 互動資料表 */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
              <div className="p-3 md:p-4 bg-slate-800 text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 sm:gap-0">
                <h2 className="font-bold flex items-center gap-2 text-sm md:text-base">
                  <UserCheck className="w-4 h-4 md:w-5 md:h-5" /> 學生資料表 (請設定各欄位的處理方式)
                </h2>
                <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                  <span className="text-xs text-blue-200 sm:hidden flex items-center gap-1 bg-slate-700 px-2 py-1 rounded">
                    <ArrowRight className="w-3 h-3" /> 左右滑動查看
                  </span>
                  {isComplete && (
                    <span className="bg-emerald-500 text-white text-xs px-2 py-1 rounded font-bold whitespace-nowrap">已安全處理完畢</span>
                  )}
                </div>
              </div>
              
              <div className="overflow-x-auto w-full relative">
                <table className="w-full text-left border-collapse min-w-[700px]">
                  <thead>
                    <tr className="bg-slate-100">
                      {COLUMNS.map((col) => (
                        <th key={col.id} className="p-2 md:p-3 border-b border-slate-200 align-top w-[14%]">
                          <div className="mb-1 md:mb-2 font-bold text-slate-700 text-xs md:text-sm">{col.label}</div>
                          
                          {/* 如果該欄位已答對，顯示處理結果 Badge */}
                          {columnStates[col.id] ? (
                            <div className="inline-flex items-center gap-1 px-1 md:px-2 py-1 rounded text-[10px] md:text-xs font-bold bg-green-100 text-green-800 border border-green-200 whitespace-nowrap">
                              <CheckCircle2 className="w-3 h-3 flex-shrink-0" />
                              <span className="truncate">{ACTIONS.find(a => a.value === columnStates[col.id])?.label.split(' ')[0]}</span>
                            </div>
                          ) : (
                            /* 如果尚未答對，顯示下拉選單讓使用者選擇 */
                            <select 
                              className={`w-full text-[11px] md:text-xs p-1 md:p-1.5 border rounded cursor-pointer outline-none focus:ring-2 focus:ring-blue-500 transition-colors
                                ${feedback?.type === 'error' ? 'border-red-300' : 'border-slate-300'}`}
                              onChange={(e) => handleActionSelect(col.id, e.target.value)}
                              value=""
                            >
                              {ACTIONS.map(action => (
                                <option key={action.value} value={action.value}>
                                  {action.value === '' ? action.label : action.label.split(' ')[0]}
                                </option>
                              ))}
                            </select>
                          )}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {RAW_DATA.map((row, index) => (
                      <tr key={row.id} className={`hover:bg-blue-50 transition-colors ${index % 2 === 0 ? 'bg-white' : 'bg-slate-50'}`}>
                        {COLUMNS.map(col => (
                          <td key={col.id} className={`p-2 md:p-3 border-b border-slate-100 text-xs md:text-sm ${
                            columnStates[col.id] === 'delete' ? 'bg-slate-100/50' : ''
                          }`}>
                            {transformData(row[col.id], columnStates[col.id], col.id)}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>

          </div>
        </div>
      );
    }

    // 將 App 渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
