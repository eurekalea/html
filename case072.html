function aiAssetResponse(id){const templates={img_ghost:'我看到低光源建築、幾扇窗戶，以及一個模糊形狀。僅從外觀，無法確認它是不是某個真人、也不能斷定圖片是否由AI生成。若要進一步了解，應尋找較早的相同圖片及原始發布說明。',img_xray:'圖片呈現一輛車和排隊人群，整體帶有年代感。但我無法只靠畫面判斷車輛用途、人物身分，或與目前學校事件是否相關。可以查找照片的典藏資訊。',img_ruins:'畫面有密集建築與海島輪廓。外觀不足以確定拍攝地點；也不能證明貼文聲稱的「學校附近」地點。建議找能核對的圖片出處及地理資料。',img_sky:'畫面是一座架在雲與岩壁間的懸浮建築。看起來可能是概念設計，也可能是影像處理；僅憑外觀不足以確認真實位置。'};return templates[id]||'我只能看到一般風景，缺少足夠線索判斷這是否與事件有關。'}

function renderAI(){const ai=S.ai;return `<div class="app-surface ai-surface">${header('AI 助理','模擬角色 · 回答仍需要查證',iconButton('ai-info','','ⓘ'))}<div class="scroll ai-chat" id="ai-scroll">${ai.messages.map(m=>`<div class="ai-bubble ${m.sender==='user'?'mine':''}">${m.asset?`<img src="${assetSrc(m.asset)}" alt="${attr(ASSET_META[m.asset]?.neutral||'')}"/>`:''}${esc(m.text)}${m.candidates?.length?`<div style="margin-top:10px">${m.candidates.map(pid=>`<button class="source-link" data-a="page" data-v="${pid}">↗ ${esc(PAGES[pid].title)}</button>`).join('')}</div>`:''}${m.canSearch?`<div style="margin-top:10px">${button('ai-find-source','請幫我搜尋圖片來源','','outline wide')}</div>`:''}</div>`).join('')}${ai.pendingRequest?'<div class="app-loading" style="min-height:60px">正在整理已提交的資訊…</div>':''}</div>${ai.draftAssetId?`<div style="background:#fff;padding:7px 12px;display:flex;align-items:center;gap:8px"><img src="${assetSrc(ai.draftAssetId)}" style="height:45px;width:53px;object-fit:cover;border-radius:8px"><span class="tiny" style="flex:1">即將上傳的圖片</span><button class="icon-btn" data-a="ai-remove">×</button></div>`:''}<form id="ai-form" class="ai-compose"><button type="button" class="attach" data-a="picker" data-v="ai">＋</button><textarea rows="1" id="aiInput" placeholder="輸入問題…">${esc(S.ai.draftText||'')}</textarea><button type="submit">↑</button></form></div>`}
function aiAsk(text='',findSource=false){if(S.ai.pendingRequest)return toast('上一則問題還在處理中，請稍候。',{app:'ai'});const v=String(text).trim();let asset=findSource?S.ai.lastSentAssetId:S.ai.draftAssetId;if(!v&&!asset&&!findSource)return toast('請先輸入問題，或上傳遊戲內相簿的圖片。');if(findSource&&!asset)return toast('請先上傳圖片，再請求尋找來源。');const sourceIntent=findSource||/找.*(?:來源|原圖)|搜尋.*(?:來源|圖片)|搜圖/.test(v);if(v||asset)S.ai.messages.push({id:makeId(),sender:'user',text:v||(asset?'請描述這張照片。':'請找來源'),asset:findSource?null:asset});if(asset&&!findSource){S.ai.lastSentAssetId=asset;S.ai.draftAssetId=null}S.ai.draftText='';const capture=asset||S.ai.lastSentAssetId,run=S.runId,reqId=makeId();S.ai.pendingRequest={reqId,assetId:capture,sourceIntent};persistRender();setTimeout(()=>{if(S.runId!==run||S.ai.pendingRequest?.reqId!==reqId)return;let response,links=[],canSearch=false;const q=norm(v);if(sourceIntent){if(!capture)response='請先上傳要查找來源的圖片。';else{links=aiCandidates(capture).filter(canAccessPage);response=links.length?'以下是可以自行打開核對的候選結果。搜尋結果不是驗證結論，你需要比較原文與圖片來源。':'目前找不到足夠的相符結果。';}}
else if(capture){response=aiAssetResponse(capture);canSearch=aiCandidates(capture).length>0}
else if(/李宇辰|宇辰|去哪|原因|生病/.test(q)){response='我不知道李宇辰沒有到校的私人原因。只憑同學猜測與網路照片，不適合替他下結論。'}
else if(/真相觀察站|怪談wiki|城市焦點新聞|甲里學生論壇/.test(q)){links=searchIndex(v).filter(canAccessPage);response=links.length?'找到該站入口；請自行閱讀其文章與引用。':'暫時沒有符合的可用頁面。'}
else if(/s51-?072|s51072/.test(q)){links=S.flags.clue72Unlocked?['T','W','N','F1']:[];response=links.length?'找到一些相關文章入口，請打開來源自行核對。':'目前沒有可提供的相符資料。'}
else response='我目前沒有足夠資料。可以提供圖片或說明你想查的內容嗎？';S.ai.messages.push({id:'airesponse:'+reqId,sender:'assistant',text:response,candidates:links,canSearch});S.ai.pendingRequest=null;save();render();},2100)}

if(focusId){const f=document.getElementById(focusId);if(f&&f===document.activeElement)return;if(f&&oldFocus&&['INPUT','TEXTAREA'].includes(f.tagName)){f.focus({preventScroll:true});try{if(oldSelection?.[0]!=null)f.setSelectionRange(...oldSelection)}catch(e){}}}

function handleChange(e){const el=e.target;if(el.dataset.a==='select'){const d=taskDraft(el.dataset.task),field=el.dataset.field,sub=el.dataset.sub;if(sub){d[field]=d[field]||{};d[field][sub]=el.value}else d[field]=el.value;delete ui.taskError[el.dataset.task];save();return}}
function handleInput(e){const el=e.target;if(el.id==='chatInput'){const id=currentRoute().chatId;S.chatDrafts[id]=el.value;save()}else if(el.id==='aiInput'){S.ai.draftText=el.value;save()}else if(el.id==='browserSearch'){ui.searchDraft[currentRoute().app]=el.value}else if(el.dataset.a==='task-input'){taskDraft(el.dataset.task)[el.dataset.field]=el.value;save()}}
function sendChat(){const chat=currentRoute().chatId,field=document.getElementById('chatInput'),text=(field?.value||S.chatDrafts[chat]||'').trim();if(!text)return;if(text.length>500)return toast('每則訊息最多500字。');S.chatDrafts[chat]='';const quick=getQuickActions(chat).find(([id,label])=>norm(label)===norm(text));if(quick){quickAction(quick[0]);return}addMessage('free:'+makeId(),chat,'player',text);save();ui.chatStuckToBottom=true;render()}
function handleSubmit(e){if(e.target.id==='chat-form'){e.preventDefault();if(!ui.composing)sendChat()}else if(e.target.id==='searchForm'){e.preventDefault();if(!ui.composing){const input=document.getElementById('searchInput');submitSearch(currentRoute().app,input?.value||'')}}else if(e.target.id==='ai-form'){e.preventDefault();if(!ui.composing)aiAsk(document.getElementById('aiInput')?.value||'')}}
function handleKey(e){if((e.isComposing||ui.composing||e.keyCode===229))return;if(e.key==='Enter'&&!e.shiftKey){if(e.target.id==='chatInput'){e.preventDefault();sendChat()}else if(e.target.id==='aiInput'){e.preventDefault();aiAsk(document.getElementById('aiInput')?.value||'')}else if(e.target.id==='browserSearch'){e.preventDefault();submitSearch(currentRoute().app,e.target.value)}}}
const appRoot=document.getElementById('root');

let dragValue=null,dragTask=null;

appRoot.addEventListener('click',handleClick);appRoot.addEventListener('change',handleChange);appRoot.addEventListener('input',handleInput);appRoot.addEventListener('submit',handleSubmit);appRoot.addEventListener('keydown',handleKey);appRoot.addEventListener('compositionstart',()=>ui.composing=true);appRoot.addEventListener('compositionend',()=>ui.composing=false);
boot();
