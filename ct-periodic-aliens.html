<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIEN40｜運算思維拆解挑戰</title>

<style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --card:#fafafa;
  --text:#172033;
  --muted:#667085;
  --placeholder:#98a2b3;
  --border:#d8dee9;
  --accent:#2563eb;
  --accent-bg:#eff6ff;
  --highlight:#fef3c7;
  --highlight-border:#f59e0b;
  --correct:#ecfdf3;
  --correct-border:#22c55e;
  --alien-head:#a7d8ff;
  --alien-body:#a8e6cf;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
  line-height:1.6;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

input::placeholder,
textarea::placeholder{
  color:var(--placeholder);
  opacity:1;
}

.container{
  width:min(1120px, calc(100% - 24px));
  margin:22px auto 50px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
}

.stage-indicator{
  font-size:14px;
  font-weight:800;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:10px;
}

.stage{
  display:none;
}

.stage.active{
  display:block;
}

.stage-label{
  color:var(--muted);
  font-size:13px;
  font-weight:900;
  letter-spacing:.05em;
}

h1,h2,h3,p{
  margin-top:0;
}

.btn{
  min-height:44px;
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-weight:800;
}

.btn-primary{
  border-color:var(--accent);
  background:var(--accent-bg);
  color:#123b83;
}

.btn.selected{
  border-color:var(--accent);
  outline:3px solid rgba(37,99,235,.2);
}

input,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  font-size:16px;
}

textarea{
  resize:vertical;
}

.flex{
  display:flex;
}

.flex-wrap{
  flex-wrap:wrap;
}

.gap-8{
  gap:8px;
}

.gap-12{
  gap:12px;
}

.justify-end{
  justify-content:flex-end;
}

.align-center{
  align-items:center;
}

.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mt-16{margin-top:16px;}
.mt-20{margin-top:20px;}
.mt-24{margin-top:24px;}

.muted{
  color:var(--muted);
}

.message{
  min-height:24px;
  margin-top:10px;
  font-weight:700;
}

.status{
  padding:11px 13px;
  border-left:4px solid var(--accent);
  border-radius:9px;
  background:#f7f9fc;
}

.grid{
  display:grid;
}

.scroll-x{
  overflow-x:auto;
}

.alien{
  display:block;
  width:70px;
  height:80px;
  margin:auto;
}


/* =========================
   STAGE 1
========================= */

.mystery-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:620px;
  margin:22px auto;
}

.mystery-alien{
  position:relative;
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:16px;
  background:#f8fafc;
  overflow:hidden;
}

.mystery-alien svg{
  filter:grayscale(1);
  opacity:.48;
  width:105px;
  height:120px;
}

.question-overlay{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:58px;
  font-weight:900;
  color:#475467;
  text-shadow:0 1px 0 #fff;
}

.start-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:14px;
}


/* =========================
   STAGE 2
========================= */

.puzzle40{
  grid-template-columns:repeat(8,1fr);
  gap:6px;
  min-width:900px;
}

.missing{
  position:relative;
  min-height:103px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed var(--accent);
  border-radius:12px;
  background:var(--card);
  font-size:26px;
  font-weight:900;
}

.missing.active-blank{
  background:var(--accent-bg);
  border-color:var(--accent);
}

.missing.wrong{
  background:var(--highlight);
  border-color:var(--highlight-border);
  box-shadow:0 0 0 2px rgba(245,158,11,.18) inset;
}

.missing.correct{
  background:var(--correct);
  border-color:var(--correct-border);
}

.blank-label{
  position:absolute;
  top:4px;
  left:5px;
  z-index:2;
  padding:1px 7px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
  font-size:12px;
  font-weight:900;
}

.blank-tab.on{
  border-color:var(--accent);
  background:var(--accent-bg);
  outline:2px solid rgba(37,99,235,.22);
}

.two-col{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:16px;
}

.preview{
  text-align:center;
}

.builder{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.option-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.assignment-box{
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#f8fafc;
  white-space:pre-wrap;
}

.score-box{
  border:2px solid var(--accent);
  background:var(--accent-bg);
  border-radius:15px;
  padding:16px;
}

.score-big{
  font-size:36px;
  line-height:1;
  font-weight:900;
}

.score-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.score-card{
  text-align:center;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  padding:10px;
}

.locked-note{
  padding:10px 12px;
  border-radius:9px;
  background:#fef3c7;
  color:#854d0e;
  font-weight:800;
}

.hidden{
  display:none !important;
}

@media(max-width:760px){

  .mystery-row{
    grid-template-columns:1fr;
  }

  .start-row{
    grid-template-columns:1fr;
  }

  .two-col{
    grid-template-columns:1fr;
  }

  .score-grid{
    grid-template-columns:1fr;
  }

  .alien{
    width:60px;
    height:70px;
  }
}
</style>
</head>


<body>

<main class="container">

<header class="header">

  <div>
    <div class="logo">
      Alien Research Center
    </div>

    <div class="subtitle">
      ALIEN40｜運算思維拆解挑戰
    </div>
  </div>

  <div
    class="stage-indicator"
    id="stageIndicator">
    STAGE 1 / 2
  </div>

</header>


<!-- =================================================
     STAGE 1
================================================= -->

<section
  id="stage1"
  class="stage active panel">

  <div class="stage-label">
    STAGE 1｜任務啟動
  </div>

  <h2>
    Alien 資料遺失事件
  </h2>

  <p>
    有 3 隻 Alien 資料遺失了。請觀察整體規律，自行決定如何拆解、比較與推論，再重建 A、B、C 三隻 Alien。
  </p>


  <div
    id="mysteryAliens"
    class="mystery-row">
  </div>


  <div class="mt-20">

    <label for="assignment">
      <strong>
        小組分工
      </strong>
    </label>

    <textarea
      id="assignment"
      rows="4"
      class="mt-8"
      placeholder="請寫下你們這組的分工"></textarea>

  </div>


  <div class="start-row">

    <input
      id="startCode"
      autocomplete="off"
      placeholder="輸入開始解題代碼">

    <button
      id="startBtn"
      type="button"
      class="btn btn-primary">
      輸入代碼開始解題
    </button>

  </div>


  <div
    id="stage1Message"
    class="message"
    aria-live="polite">
  </div>

</section>


<!-- =================================================
     STAGE 2
================================================= -->

<section
  id="stage2"
  class="stage panel">

  <div class="stage-label">
    STAGE 2｜ALIEN40 解題
  </div>

  <h2>
    重建 3 隻失蹤 Alien
  </h2>

  <p>
    請觀察 40 隻 Alien 的整體規律，自行決定如何拆解、比較與推論。
  </p>


  <div class="status mt-16">
    本關不提供特徵濾鏡與提示。請依照小組自己的策略完成 A、B、C。
  </div>


  <div class="scroll-x mt-16">

    <div
      id="grid40"
      class="grid puzzle40">
    </div>

  </div>


  <div class="flex flex-wrap gap-8 mt-20">

    <button
      type="button"
      class="btn blank-tab on"
      data-blank="A">
      缺格 A
    </button>

    <button
      type="button"
      class="btn blank-tab"
      data-blank="B">
      缺格 B
    </button>

    <button
      type="button"
      class="btn blank-tab"
      data-blank="C">
      缺格 C
    </button>

  </div>


  <div class="two-col mt-16">

    <div class="card preview">

      <strong id="currentBlankTitle">
        正在解：A
      </strong>

      <div
        id="previewAlien"
        class="mt-8">
      </div>

      <button
        id="lockBlank"
        type="button"
        class="btn btn-primary mt-12"
        style="width:100%">
        鎖定這一格
      </button>

    </div>


    <div
      id="builder"
      class="builder">
    </div>

  </div>


  <!-- Stage 1 的回答帶入 Stage 2 -->

  <div class="mt-20">

    <strong>
      你們這組的分工
    </strong>

    <div
      id="assignmentDisplay"
      class="assignment-box mt-8">
    </div>

  </div>


  <!-- 已刪除「方法或證據」文字框 -->


  <div
    id="lockedNotice"
    class="locked-note mt-20 hidden">

    答案已送出，作答內容已鎖定，無法再修改。

  </div>


  <div class="flex justify-end mt-20">

    <button
      id="submitAnswer"
      type="button"
      class="btn btn-primary">

      計算分數

    </button>

  </div>


  <div
    id="stage2Message"
    class="message"
    aria-live="polite">
  </div>


  <div
    id="scoreArea"
    class="mt-20 hidden">
  </div>

</section>

</main>


<script>
(() => {

"use strict";


/* =================================================
   DATA
================================================= */

const heads = [
  "round",
  "square",
  "triangle",
  "hex",
  "diamond"
];


const antennas = [
  "short",
  "long",
  "fork",
  "loop"
];


/*
只留三種身體，
避免橢圓與圓形過度相似。
*/

const bodies = [
  "oval",
  "box",
  "shield"
];


const symbols = [
  "dot",
  "bar",
  "diamond",
  "cross",
  "ring",
  "star",
  "plus",
  "wave"
];


const featureLabels = {

  head:"頭部",
  eyes:"眼睛",
  antenna:"觸角",
  body:"身體",
  symbol:"身體符號"

};


/* =================================================
   CREATE 40 ALIENS
================================================= */

function make40(){

  const data = [];


  for(
    let row = 0;
    row < 5;
    row++
  ){

    for(
      let col = 0;
      col < 8;
      col++
    ){

      data.push({

        id:
          row * 8 + col,

        row,
        col,

        head:
          heads[row],

        eyes:
          (col % 4) + 1,

        antenna:
          antennas[
            (row + col) % 4
          ],

        body:
          bodies[
            col % 3
          ],

        symbol:
          symbols[col]

      });

    }

  }


  return data;

}


const aliens =
  make40();


const blankLocations = {

  A:6,
  B:19,
  C:36

};


/* =================================================
   STATE
================================================= */

let assignmentText = "";

let activeBlank = "A";


let build = {

  head:"round",
  eyes:1,
  antenna:"short",
  body:"oval",
  symbol:"dot"

};


let saved = {

  A:null,
  B:null,
  C:null

};


let submitted = false;


let wrongBlanks =
  new Set();


let correctBlanks =
  new Set();


/* =================================================
   ALIEN SVG
================================================= */

function alienSVG(
  alien,
  grey = false
){

  let headShape = "";


  if(
    alien.head === "round"
  ){

    headShape =
      `<circle
        cx="50"
        cy="27"
        r="18"/>`;

  }

  else if(
    alien.head === "square"
  ){

    headShape =
      `<rect
        x="32"
        y="9"
        width="36"
        height="36"
        rx="4"/>`;

  }

  else if(
    alien.head === "triangle"
  ){

    headShape =
      `<path
        d="
          M50 7
          L72 45
          L28 45
          Z
        "/>`;

  }

  else if(
    alien.head === "hex"
  ){

    headShape =
      `<path
        d="
          M35 10
          L65 10
          L73 27
          L65 44
          L35 44
          L27 27
          Z
        "/>`;

  }

  else{

    headShape =
      `<path
        d="
          M50 6
          L72 27
          L50 48
          L28 27
          Z
        "/>`;

  }


  let eyeShapes = "";


  for(
    let i = 0;
    i < alien.eyes;
    i++
  ){

    const x =
      50 +
      (
        i -
        (alien.eyes - 1) / 2
      ) * 8;


    eyeShapes +=
      `<circle
        cx="${x}"
        cy="27"
        r="2.4"/>`;

  }


  const antennaShape =

    alien.antenna === "short"

    ? `<path
        d="
          M42 12 L38 4
          M58 12 L62 4
        "/>`

    : alien.antenna === "long"

    ? `<path
        d="
          M42 12 L34 0
          M58 12 L66 0
        "/>`

    : alien.antenna === "fork"

    ? `<path
        d="
          M42 12 L37 3
          M37 3 L32 0
          M37 3 L42 0
          M58 12 L63 3
          M63 3 L58 0
          M63 3 L68 0
        "/>`

    : `<path
        d="
          M42 12
          C31 3 35 -3 42 3
          M58 12
          C69 3 65 -3 58 3
        "/>`;


  const bodyShape =

    alien.body === "oval"

    ? `<ellipse
        cx="50"
        cy="69"
        rx="23"
        ry="24"/>`

    : alien.body === "box"

    ? `<rect
        x="28"
        y="49"
        width="44"
        height="43"
        rx="7"/>`

    : `<path
        d="
          M27 50
          H73
          L68 80
          L50 96
          L32 80
          Z
        "/>`;


  const symbolMap = {

    dot:
      `<circle
        cx="50"
        cy="69"
        r="5"/>`,

    bar:
      `<rect
        x="39"
        y="65"
        width="22"
        height="7"/>`,

    diamond:
      `<path
        d="
          M50 59
          L60 69
          L50 79
          L40 69
          Z
        "/>`,

    cross:
      `<path
        d="
          M42 61 L58 77
          M58 61 L42 77
        "
        fill="none"/>`,

    ring:
      `<circle
        cx="50"
        cy="69"
        r="8"
        fill="none"/>`,

    star:
      `<path
        d="
          M50 58
          L53 66
          L62 66
          L55 71
          L58 80
          L50 75
          L42 80
          L45 71
          L38 66
          L47 66
          Z
        "/>`,

    plus:
      `<path
        d="
          M50 59 V79
          M40 69 H60
        "
        fill="none"/>`,

    wave:
      `<path
        d="
          M39 66
          Q45 59 50 66
          T61 66
        "
        fill="none"/>`

  };


  const style =
    grey
      ? `style="filter:grayscale(1);opacity:.48"`
      : "";


  return `
    <svg
      class="alien"
      ${style}
      viewBox="0 0 100 105"
      role="img"
      aria-label="Alien">

      <g
        stroke="currentColor"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round">

        <g fill="none">
          ${antennaShape}
        </g>

        <g fill="var(--alien-head)">
          ${headShape}
        </g>

        <g
          fill="var(--text)"
          stroke="none">
          ${eyeShapes}
        </g>

        <g fill="var(--alien-body)">
          ${bodyShape}
        </g>

        <g fill="var(--text)">
          ${symbolMap[
            alien.symbol
          ]}
        </g>

        <g
          fill="none"
          opacity=".7">

          <path
            d="
              M29 61 L17 74
              M71 61 L83 74
              M41 90 L36 101
              M59 90 L64 101
            "/>

        </g>

      </g>

    </svg>
  `;

}


/* =================================================
   STAGE 1 RANDOM 3 ALIENS
================================================= */

function randomThree(){

  const pool =
    [...aliens];

  const chosen = [];


  while(
    chosen.length < 3
  ){

    const index =
      Math.floor(
        Math.random() *
        pool.length
      );


    chosen.push(
      pool.splice(
        index,
        1
      )[0]
    );

  }


  return chosen;

}


function renderMystery(){

  document
    .getElementById(
      "mysteryAliens"
    )
    .innerHTML =

      randomThree()
        .map(
          alien => {

            return `
              <div class="mystery-alien">

                ${alienSVG(
                  alien,
                  true
                )}

                <div class="question-overlay">
                  ?
                </div>

              </div>
            `;

          }
        )
        .join("");

}


renderMystery();


/* =================================================
   STAGE 1 → STAGE 2
================================================= */

function goStage2(){

  assignmentText =
    document
      .getElementById(
        "assignment"
      )
      .value
      .trim();


  const code =
    document
      .getElementById(
        "startCode"
      )
      .value
      .trim()
      .toLowerCase();


  if(
    !assignmentText
  ){

    document
      .getElementById(
        "stage1Message"
      )
      .textContent =
        "請先寫下你們這組的分工。";

    return;

  }


  if(
    code !== "alien40"
  ){

    document
      .getElementById(
        "stage1Message"
      )
      .textContent =
        "開始解題代碼不正確。";

    return;

  }


  document
    .getElementById(
      "stage1"
    )
    .classList
    .remove("active");


  document
    .getElementById(
      "stage2"
    )
    .classList
    .add("active");


  document
    .getElementById(
      "stageIndicator"
    )
    .textContent =
      "STAGE 2 / 2";


  document
    .getElementById(
      "assignmentDisplay"
    )
    .textContent =
      assignmentText;


  renderAll();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document
  .getElementById(
    "startBtn"
  )
  .addEventListener(
    "click",
    goStage2
  );


document
  .getElementById(
    "startCode"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        goStage2();

      }

    }
  );


/* =================================================
   GRID
================================================= */

function renderGrid(){

  const reverse = {};


  Object
    .entries(
      blankLocations
    )
    .forEach(
      ([key,id]) => {

        reverse[id] =
          key;

      }
    );


  document
    .getElementById(
      "grid40"
    )
    .innerHTML =

      aliens
        .map(
          alien => {

            const key =
              reverse[
                alien.id
              ];


            if(!key){

              return `
                <div class="card">
                  ${alienSVG(alien)}
                </div>
              `;

            }


            const classes = [
              "missing"
            ];


            /*
            作答中：
            當前處理的格子藍色
            */

            if(
              !submitted &&
              key === activeBlank
            ){

              classes.push(
                "active-blank"
              );

            }


            /*
            送出後：
            有任一特徵錯誤 → 黃色
            */

            if(
              submitted &&
              wrongBlanks.has(key)
            ){

              classes.push(
                "wrong"
              );

            }


            /*
            五項全部正確 → 綠色
            */

            if(
              submitted &&
              correctBlanks.has(key)
            ){

              classes.push(
                "correct"
              );

            }


            return `
              <div
                class="${classes.join(" ")}">

                <span class="blank-label">
                  ${key}
                </span>

                ${
                  saved[key]

                    ? alienSVG(
                        saved[key]
                      )

                    : "<span>?</span>"
                }

              </div>
            `;

          }
        )
        .join("");

}


/* =================================================
   BUILDER LABELS
================================================= */

const labelHead =
  value => ({

    round:"圓形",
    square:"方形",
    triangle:"三角形",
    hex:"六角形",
    diamond:"菱形"

  })[value];


const labelAntenna =
  value => ({

    short:"短觸角",
    long:"長觸角",
    fork:"分叉觸角",
    loop:"彎曲觸角"

  })[value];


const labelBody =
  value => ({

    oval:"橢圓身體",
    box:"方形身體",
    shield:"盾形身體"

  })[value];


const labelSymbol =
  value => ({

    dot:"圓點",
    bar:"橫條",
    diamond:"菱形",
    cross:"叉號",
    ring:"圓環",
    star:"星形",
    plus:"加號",
    wave:"波浪"

  })[value];


function optionGroup(
  values,
  key,
  current,
  labelFunction
){

  return `
    <div class="card">

      <strong>
        ${featureLabels[key]}
      </strong>

      <div class="option-row mt-8">

        ${values
          .map(
            value => {

              const selected =
                current === value
                  ? "selected"
                  : "";


              const disabled =
                submitted
                  ? "disabled"
                  : "";


              return `
                <button
                  type="button"
                  ${disabled}
                  class="btn ${selected}"
                  data-key="${key}"
                  data-value="${value}">

                  ${labelFunction(value)}

                </button>
              `;

            }
          )
          .join("")}

      </div>

    </div>
  `;

}


/* =================================================
   BUILDER
================================================= */

function renderBuilder(){

  document
    .getElementById(
      "currentBlankTitle"
    )
    .textContent =
      submitted
        ? "答案已送出"
        : "正在解：" +
          activeBlank;


  document
    .getElementById(
      "previewAlien"
    )
    .innerHTML =
      alienSVG(build);


  document
    .getElementById(
      "builder"
    )
    .innerHTML =

      optionGroup(
        heads,
        "head",
        build.head,
        labelHead
      )

      +

      optionGroup(
        [1,2,3,4],
        "eyes",
        build.eyes,
        value =>
          value + " 眼"
      )

      +

      optionGroup(
        antennas,
        "antenna",
        build.antenna,
        labelAntenna
      )

      +

      optionGroup(
        bodies,
        "body",
        build.body,
        labelBody
      )

      +

      optionGroup(
        symbols,
        "symbol",
        build.symbol,
        labelSymbol
      );


  if(!submitted){

    document
      .getElementById(
        "builder"
      )
      .querySelectorAll(
        "[data-key]"
      )
      .forEach(
        button => {

          button
            .addEventListener(
              "click",
              () => {

                const key =
                  button
                    .dataset
                    .key;


                let value =
                  button
                    .dataset
                    .value;


                if(
                  key ===
                  "eyes"
                ){

                  value =
                    Number(value);

                }


                build[key] =
                  value;


                renderBuilder();

              }
            );

        }
      );

  }


  document
    .getElementById(
      "lockBlank"
    )
    .disabled =
      submitted;

}


/* =================================================
   SELECT A / B / C
================================================= */

document
  .querySelectorAll(
    ".blank-tab"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            if(submitted){
              return;
            }


            activeBlank =
              button
                .dataset
                .blank;


            if(
              saved[
                activeBlank
              ]
            ){

              build = {

                ...saved[
                  activeBlank
                ]

              };

            }

            else{

              build = {

                head:"round",
                eyes:1,
                antenna:"short",
                body:"oval",
                symbol:"dot"

              };

            }


            renderAll();

          }
        );

    }
  );


/* =================================================
   LOCK CURRENT ALIEN
================================================= */

document
  .getElementById(
    "lockBlank"
  )
  .addEventListener(
    "click",
    () => {

      if(submitted){
        return;
      }


      saved[
        activeBlank
      ] = {

        ...build

      };


      renderGrid();


      document
        .getElementById(
          "stage2Message"
        )
        .textContent =
          `缺格 ${activeBlank} 已鎖定，預測 Alien 已放回格子中。`;

    }
  );


/* =================================================
   RENDER ALL
================================================= */

function renderAll(){

  renderGrid();
  renderBuilder();


  document
    .querySelectorAll(
      ".blank-tab"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "on",
            !submitted &&
            button
              .dataset
              .blank ===
            activeBlank
          );


        button.disabled =
          submitted;

      }
    );

}


/* =================================================
   計算分數
================================================= */

document
  .getElementById(
    "submitAnswer"
  )
  .addEventListener(
    "click",
    calculateScore
  );


function calculateScore(){

  /*
  防止重複計分
  */

  if(submitted){
    return;
  }


  /*
  三個 Alien 都必須先鎖定
  */

  if(
    !saved.A ||
    !saved.B ||
    !saved.C
  ){

    document
      .getElementById(
        "stage2Message"
      )
      .textContent =
        "請先完成並鎖定 A、B、C 三隻 Alien，再計算分數。";

    return;

  }


  /*
  使用瀏覽器確認視窗
  */

  const confirmed =
    window.confirm(
      "送出後無法再修改答案，確定送出?"
    );


  /*
  學生按取消
  */

  if(!confirmed){
    return;
  }


  /*
  學生按確定
  */

  submitted = true;


  wrongBlanks.clear();
  correctBlanks.clear();


  const fields = [

    "head",
    "eyes",
    "antenna",
    "body",
    "symbol"

  ];


  let totalScore = 0;


  const detail = {

    A:0,
    B:0,
    C:0

  };


  /*
  A、B、C 分別計分
  */

  [
    "A",
    "B",
    "C"
  ]
  .forEach(
    blank => {

      const answer =
        aliens[
          blankLocations[
            blank
          ]
        ];


      const student =
        saved[
          blank
        ];


      fields
        .forEach(
          feature => {

            /*
            一個特徵正確 = 1 分
            */

            if(
              student[
                feature
              ] ===
              answer[
                feature
              ]
            ){

              totalScore++;

              detail[
                blank
              ]++;

            }

          }
        );


      /*
      一隻 Alien 五個特徵全對
      */

      if(
        detail[
          blank
        ] === 5
      ){

        correctBlanks
          .add(blank);

      }


      /*
      任一特徵錯誤
      整格標黃色
      */

      else{

        wrongBlanks
          .add(blank);

      }

    }
  );


  /*
  鎖定「計算分數」按鈕
  */

  const submitButton =
    document
      .getElementById(
        "submitAnswer"
      );


  submitButton.disabled =
    true;


  submitButton.textContent =
    "答案已送出";


  /*
  顯示鎖定訊息
  */

  document
    .getElementById(
      "lockedNotice"
    )
    .classList
    .remove("hidden");


  /*
  重畫：
  - 保留學生答案
  - 錯格黃色
  - 正確格綠色
  - 所有按鈕 disabled
  */

  renderAll();


  document
    .getElementById(
      "stage2Message"
    )
    .textContent =
      "計分完成。黃色格子表示該 Alien 至少有一個特徵需要重新檢查。";


  /*
  顯示分數
  */

  const scoreArea =
    document
      .getElementById(
        "scoreArea"
      );


  scoreArea
    .classList
    .remove("hidden");


  scoreArea.innerHTML = `

    <div class="score-box">

      <div class="muted">
        本組得分
      </div>


      <div class="score-big mt-8">
        ${totalScore} / 15
      </div>


      <div class="score-grid mt-16">

        <div class="score-card">

          <strong>
            Alien A
          </strong>

          <div>
            ${detail.A} / 5
          </div>

        </div>


        <div class="score-card">

          <strong>
            Alien B
          </strong>

          <div>
            ${detail.B} / 5
          </div>

        </div>


        <div class="score-card">

          <strong>
            Alien C
          </strong>

          <div>
            ${detail.C} / 5
          </div>

        </div>

      </div>


      <p
        class="mt-16"
        style="margin-bottom:0">

        <strong>
          計分方式：
        </strong>

        每隻 Alien 有 5 個特徵；
        每答對 1 個特徵得 1 分，
        三隻合計滿分 15 分。

      </p>

    </div>

  `;

}


})();
</script>

</body>
</html>
